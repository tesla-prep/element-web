    # CIRQLE Messenger (github.com/tesla-prep/element-web, branch cirqle) at /next,
    # beside the stock Element at /, until the owner switches staff over.
    # Same origin, so a signed-in browser is signed in here too.
    location = /next { return 301 /next/; }
    location /next/ {
        alias /opt/team-messenger/prod/element-next/webapp/;
        add_header Cache-Control "no-cache";
    }
    location /next/bundles/ {
        alias /opt/team-messenger/prod/element-next/webapp/bundles/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
