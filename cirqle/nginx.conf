    # Inside the chat.cirqlecirqle.com server block of /etc/nginx/conf.d/team-messenger.conf
    # (the full file is tesla-prep/cirqle-agents deploy/team-messenger/prod/nginx/).
    root /opt/team-messenger/prod/element-next/webapp;
    index index.html;

    # /next was its address while the stock Element held /: old links and
    # bookmarks land on the same place at / (the #/room/... part stays as it is).
    location = /next { return 301 /; }
    location ^~ /next/ {
        rewrite ^/next/(.*)$ /$1 permanent;
    }
    # The service worker a browser registered for /next/ asks for this file to
    # update itself; it gets one that unregisters it.
    location = /next/sw.js {
        alias /opt/team-messenger/prod/element-next/next-sw-unregister.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location /bundles/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
