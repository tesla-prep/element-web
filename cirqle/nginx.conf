    # Inside the chat.cirqlecirqle.com server block of /etc/nginx/conf.d/team-messenger.conf
    # (the full file is tesla-prep/cirqle-agents deploy/team-messenger/prod/nginx/).
    root /opt/team-messenger/prod/element-next/webapp;
    index index.html;

    # The Matrix client API on the app's own domain (CIRQLE.md, «One domain»). The
    # full file also sends the relay bot's routes (user_directory/search, createRoom,
    # com.cirqle/leave_group, com.cirqle/group_admin) to 127.0.0.1:9020, as on matrix.
    location /_matrix/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host matrix.cirqlecirqle.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        client_max_body_size 100M;
    }
    location ~ ^/_matrix/client/(v3|r0|unstable)/login/sso/redirect {
        return 302 https://matrix.cirqlecirqle.com$request_uri;
    }
    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        return 200 '{"m.homeserver":{"base_url":"https://chat.cirqlecirqle.com/"},"io.element.e2ee":{"default":false}}';
    }

    # /next was its address while the stock Element held /: old links and
    # bookmarks land on the same place at / (the #/room/... part stays as it is).
    location = /next { return 301 /; }
    location ^~ /next/ {
        rewrite ^/next/(.*)$ /$1 permanent;
    }
    # The service worker a browser registered for /next/ asks for this file to
    # update itself; it gets one that unregisters it.
    location = /next/sw.js {
        alias /opt/team-messenger/prod/element-next/next-sw-unregister.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # deploy.sh puts a .gz beside every bundle file; application/wasm is not in the
    # global gzip_types, so without this the 7.8 MB crypto WASM goes uncompressed.
    location /bundles/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
        gzip_types text/css application/javascript application/wasm application/json;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
